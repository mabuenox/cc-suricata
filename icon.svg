<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Clawd, el mascota de Claude Code, erguido como un suricata vigilante -->
  <g fill="#d97757">
    <!-- cola -->
    <path d="M21.5 25c3.5 0 5.5-1.5 5.5-5" fill="none" stroke="#d97757" stroke-width="2.6" stroke-linecap="round"/>
    <!-- cuerpo alto -->
    <rect x="10" y="12" width="12" height="16" rx="3.5"/>
    <!-- cabeza, más ancha y girada hacia la derecha -->
    <rect x="9" y="3.5" width="15" height="10.5" rx="4"/>
    <!-- orejas -->
    <rect x="7.5" y="6.5" width="2.5" height="3.2" rx="1"/>
    <rect x="23" y="6.5" width="2.5" height="3.2" rx="1"/>
  </g>
  <!-- ojos mirando a la derecha, atentos -->
  <g fill="#1b1b1f">
    <rect x="16" y="7" width="2.4" height="3.2" rx=".7"/>
    <rect x="20.5" y="7" width="2.4" height="3.2" rx=".7"/>
  </g>
  <!-- brazos recogidos delante -->
  <rect x="12" y="17" width="8" height="2.6" rx="1.3" fill="#b85f41"/>
  <!-- barriga clara -->
  <rect x="13" y="20.8" width="6" height="5.4" rx="2.2" fill="#f0b196" opacity=".85"/>
  <!-- patitas -->
  <g fill="#d97757">
    <rect x="10.5" y="27.5" width="3.4" height="2.6" rx="1"/>
    <rect x="18" y="27.5" width="3.4" height="2.6" rx="1"/>
  </g>
</svg>
