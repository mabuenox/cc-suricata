<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sesiones de Claude Code</title>
<style>
  :root { color-scheme: dark; --bg: #16181d; --panel: #1c1f25; --line: #2a2e36; --text: #e6e6e6; --dim: #8b8f98; --busy: #d9a033; --idle: #4caf7d; --waiting: #e05d5d; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: grid; grid-template-columns: 380px 1fr; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
  aside { border-right: 1px solid var(--line); overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 14px; }
  .banner { border: 1px solid var(--waiting); border-radius: 10px; padding: 12px 14px; background: #e05d5d14; cursor: pointer; }
  .banner .line { display: flex; justify-content: space-between; gap: 8px; }
  .banner b { color: var(--text); } .banner .why { color: var(--waiting); margin-top: 2px; }
  h2 { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin: 0 0 6px 4px; }
  .group { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .row { display: grid; grid-template-columns: 10px 1fr auto; column-gap: 8px; align-items: center; padding: 9px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .row:last-child { border-bottom: 0; } .row:hover { background: #ffffff08; } .row.selected { background: #ffffff10; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
  .busy .dot { background: var(--busy); animation: pulse 1.6s infinite; } .idle .dot { background: var(--idle); } .waiting .dot { background: var(--waiting); }
  @keyframes pulse { 50% { opacity: .35; } }
  .row .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .name b { font-weight: 600; } .row .name span { color: var(--dim); margin-left: 6px; font-size: 12px; }
  .row .time { color: var(--dim); font-size: 11px; white-space: nowrap; }
  .row .state { grid-column: 2 / 4; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .busy .state { color: var(--busy); } .idle .state { color: var(--idle); } .waiting .state { color: var(--waiting); }
  .state .tool { font-family: ui-monospace, Consolas, monospace; }
  .row .info { grid-column: 2 / 4; color: var(--dim); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .files { font-family: ui-monospace, Consolas, monospace; font-size: 12px; white-space: pre; overflow: auto; }
  main { overflow: auto; padding: 20px 28px; display: flex; flex-direction: column; gap: 16px; }
  main .title { font-size: 18px; font-weight: 600; }
  main .status { font-size: 12px; margin-left: 10px; }
  .busy .status { color: var(--busy); } .idle .status { color: var(--idle); } .waiting .status { color: var(--waiting); }
  .meta { color: var(--dim); font-size: 12px; overflow-wrap: anywhere; }
  .label { color: var(--dim); font-size: 11px; text-transform: uppercase; margin-bottom: 6px; }
  .block { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; overflow-wrap: anywhere; }
  .md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
  .md p, .md ul, .md ol, .md pre { margin: 0 0 10px; } .md h1, .md h2, .md h3 { font-size: 14px; margin: 14px 0 6px; }
  .md code { font-family: ui-monospace, Consolas, monospace; font-size: 12px; background: #ffffff10; padding: 1px 4px; border-radius: 3px; }
  .md pre { background: #0f1115; padding: 10px 12px; border-radius: 6px; overflow: auto; } .md pre code { background: none; padding: 0; }
  .md table { border-collapse: collapse; } .md th, .md td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; }
  .md a { color: #7ab7ff; }
  .empty { color: var(--dim); margin: auto; }
  @media (max-width: 800px) { body { grid-template-columns: 1fr; grid-template-rows: 45vh 1fr; } aside { border-right: 0; border-bottom: 1px solid var(--line); } }
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.7/marked.min.js" integrity="sha384-H+hy9ULve6xfxRkWIh/YOtvDdpXgV2fmAGQkIDTxIgZwNoaoBal14Di2YTMR6MzR" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.4/purify.min.js" integrity="sha384-eEu5CTj3qGvu9PdJuS+YlkNi7d2XxQROAFYOr59zgObtlcux1ae1Il3u7jvdCSWu" crossorigin="anonymous"></script>
<aside id="list"><div class="empty">Conectando…</div></aside>
<main id="detail"><div class="empty">Selecciona una sesión</div></main>
<script>
  const GROUPS = [['waiting', 'Te necesitan'], ['idle', 'Esperándote'], ['busy', 'Trabajando']]
  const esc = (s) => String(s ?? '').replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]))
  const dur = (ms) => {
    const s = Math.round(ms / 1000)
    return s < 60 ? `${s} s` : s < 3600 ? `${Math.round(s / 60)} min` : `${Math.round(s / 3600)} h`
  }
  const ago = (ms) => ms ? `hace ${dur(Date.now() - new Date(ms))}` : ''
  const k = (n) => n == null ? '' : n >= 1000 ? `${Math.round(n / 1000)}k` : String(n)
  const modelOf = (s) => s.model?.split('-')[1] ?? ''
  // shortcut: la ventana de contexto depende del modelo (200k o 1M), así que se muestra el tamaño absoluto y no un %.
  const info = (s) => [modelOf(s), s.permissionMode, s.contextTokens && `ctx ${k(s.contextTokens)}`, s.status === 'busy' && s.lastPrompt?.at && `turno de ${dur(Date.now() - new Date(s.lastPrompt.at))}`]
    .filter(Boolean).map(esc).join(' · ')
  // Markdown si las librerías cargaron (CDN); si no, texto plano.
  const md = (text) => window.marked && window.DOMPurify ? DOMPurify.sanitize(marked.parse(text)) : esc(text)
  const block = (label, text) => text ? `<div><div class="label">${label}</div><div class="block md">${md(text)}</div></div>` : ''
  const state = (s) => s.status === 'waiting' ? `Te pregunta · <span class="tool">AskUserQuestion</span>`
    : s.status === 'idle' ? 'Esperándote'
    : `Trabajando${s.currentTool ? ` · <span class="tool">${esc(s.currentTool)}</span>` : ''}`
  const nameOf = (s) => `<b>${esc(s.name ?? s.cwd)}</b>${s.branch ? `<span>${esc(s.branch)}</span>` : ''}`

  let sessions = []
  let selectedId = null

  function render() {
    const sorted = [...sessions].sort((a, b) => b.updatedAt - a.updatedAt)
    if (!sorted.some((s) => s.sessionId === selectedId)) selectedId = sorted.find((s) => s.status === 'waiting')?.sessionId ?? sorted[0]?.sessionId ?? null
    const pending = sorted.filter((s) => s.status !== 'busy').length
    document.title = `${pending ? `(${pending}) ` : ''}Sesiones de Claude Code`

    const urgent = sorted.find((s) => s.status === 'waiting')
    const banner = urgent ? `<div class="banner" data-id="${urgent.sessionId}">
        <div class="line"><span>${nameOf(urgent)} necesita tu respuesta</span><span class="time">${ago(urgent.updatedAt)}</span></div>
        <div class="why">${esc(urgent.waitingQuestion)}</div>
      </div>` : ''
    const groups = GROUPS.map(([status, label]) => {
      const rows = sorted.filter((s) => s.status === status)
      return rows.length ? `<section><h2>${label} · ${rows.length}</h2><div class="group">${rows.map((s) => `
        <div class="row ${s.status}${s.sessionId === selectedId ? ' selected' : ''}" data-id="${s.sessionId}" title="${esc(s.cwd)}">
          <span class="dot"></span><span class="name">${nameOf(s)}</span><span class="time">${ago(s.statusSince ?? s.updatedAt)}</span>
          <span class="state">${state(s)}</span>
          <span class="info">${info(s)}</span>
        </div>`).join('')}</div></section>` : ''
    }).join('')
    document.getElementById('list').innerHTML = sorted.length ? banner + groups : '<div class="empty">No hay sesiones de Claude Code abiertas</div>'

    const s = sorted.find((x) => x.sessionId === selectedId)
    document.getElementById('detail').innerHTML = s ? `
      <div class="${s.status}"><span class="title">${esc(s.name ?? s.cwd)}</span><span class="status">${state(s)} ${ago(s.statusSince)}</span></div>
      <div class="meta">${esc(s.title ?? '')}${s.title ? ' · ' : ''}${esc(s.cwd)}${s.branch ? ` · ${esc(s.branch)}` : ''}</div>
      <div class="meta">${info(s)} · abierta ${ago(s.startedAt)}${s.prompts ? ` · ${s.prompts} prompts, ${s.turns} turnos` : ''} · ${k(s.outputTokens)} tokens generados${s.agents ? ` · ${s.agents} agente${s.agents > 1 ? 's' : ''} en marcha` : ''}</div>
      ${block('Pregunta', s.waitingQuestion)}
      ${s.editedFiles.length ? `<div><div class="label">Ficheros editados</div><div class="block files">${s.editedFiles.map(esc).join('\n')}</div></div>` : ''}
      ${block('Tu último prompt', s.lastPrompt?.text)}
      ${block('Última respuesta', s.lastAnswer?.text)}` : ''
  }

  document.getElementById('list').addEventListener('click', (e) => {
    const el = e.target.closest('[data-id]')
    if (el) { selectedId = el.dataset.id; render() }
  })
  new EventSource('/events').onmessage = (e) => { sessions = JSON.parse(e.data); render() }
  setInterval(render, 30000)
</script>
</body>
</html>
