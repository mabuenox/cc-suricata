# On every push to main, release-please keeps a "chore(main): release X.Y.Z" PR
# with package.json and CHANGELOG.md updated from the commits (fix:, feat:, feat!:).
# Merging that PR creates the tag and the GitHub release, and the publish job uploads
# the package to npm with trusted publishing (OIDC): no token, no 2FA.
# Actions are pinned to a SHA; Dependabot proposes the updates.
name: release
on:
  push:
    branches: [main]
permissions: {}
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          release-type: node
  publish:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # only here: the OIDC token npm accepts as trusted publisher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm test
      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5
      - run: npm publish --provenance --access public
