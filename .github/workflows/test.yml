name: test
# On push only: a pull_request trigger also fires for the release PR the bot opens with the
# GITHUB_TOKEN, and GitHub kills that run before any job starts, leaving a red X on every release.
# Pushes by the bot do not trigger workflows at all, so the release branch stays silent; its tests
# run in the publish job before uploading to npm. Forks are not covered (their pushes are elsewhere).
on:
  push:
    branches-ignore: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm test
